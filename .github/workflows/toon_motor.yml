name: Estúdio Toon

on:
  push:
    paths:
      - "toon/**.json"
  workflow_dispatch:
    inputs:
      roteiro:
        description: "caminho do roteiro (toon/xxx.json)"
        required: true

permissions:
  contents: write

concurrency:
  group: estudio-toon
  cancel-in-progress: true

jobs:
  preparar:
    runs-on: ubuntu-latest
    outputs:
      roteiro: ${{ steps.r.outputs.roteiro }}
      id: ${{ steps.r.outputs.id }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - id: r
        run: |
          R="${{ github.event.inputs.roteiro }}"
          [ -z "$R" ] && R=$(git diff --name-only HEAD~1 HEAD -- 'toon/*.json' | head -1)
          echo "roteiro=$R" >> $GITHUB_OUTPUT
          echo "id=$(basename $R .json)" >> $GITHUB_OUTPUT
          echo "roteiro: $R"

  render:
    needs: preparar
    if: needs.preparar.outputs.roteiro != ''
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: true
      matrix:
        parte: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      - name: Instalar Blender
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq xvfb libegl1 libgl1 libgl1-mesa-dri libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 >/dev/null
          curl -sSfL -o b.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar -xf b.tar.xz && mv blender-4.2.3-linux-x64 /tmp/blender && rm b.tar.xz
      - name: Renderizar parte ${{ matrix.parte }}
        run: |
          mkdir -p /tmp/quadros
          ini=$(date +%s)
          set -o pipefail
          xvfb-run -a -s "-screen 0 1920x1080x24" /tmp/blender/blender -b -P blender/toon/motor.py -- \
            "${{ needs.preparar.outputs.roteiro }}" /tmp/quadros ${{ matrix.parte }} 4 2>&1 | grep -v "^Fra:" | grep -iv "^Saved\|Time:" | tail -30
          echo "parte ${{ matrix.parte }} em $(( $(date +%s) - ini ))s, $(ls /tmp/quadros | wc -l) quadros" | tee /tmp/quadros/tempo_${{ matrix.parte }}.txt
      - uses: actions/upload-artifact@v4
        with:
          name: quadros-${{ matrix.parte }}
          path: /tmp/quadros
          retention-days: 2

  juntar:
    needs: [preparar, render]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/partes
      - name: Montar o vídeo e devolver
        run: |
          ID=${{ needs.preparar.outputs.id }}
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p /tmp/q saidas3d/$ID
          cp /tmp/partes/*/f_*.png /tmp/q/
          cat /tmp/partes/*/tempo_*.txt > saidas3d/$ID/tempos.txt
          ffmpeg -v error -y -framerate 24 -start_number 1 -i /tmp/q/f_%04d.png -c:v libx264 -preset veryfast -crf 19 -pix_fmt yuv420p saidas3d/$ID/video3d.mp4
          n=$(ls /tmp/q | wc -l); for k in 4 2 1; do f=$(printf "f_%04d.png" $(( n * k / 5 ))); cp /tmp/q/$f saidas3d/$ID/ 2>/dev/null || true; done
          git config user.name "estudio-vozes"
          git config user.email "actions@users.noreply.github.com"
          git add saidas3d/$ID
          git commit -qm "Estúdio Toon: $ID"
          for t in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
