name: Teste VoiceStudio

# Teste isolado: gera duas falas com o motor OmniVoice do VoiceStudio
# (github.com/debpalash/VoiceStudio, commit fixado) e devolve os WAV na branch.
on:
  push:
    branches: [teste-voicestudio]
    paths: [".github/workflows/teste_voicestudio.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Baixar VoiceStudio (commit fixado)
        run: |
          git clone https://github.com/debpalash/VoiceStudio.git vs
          git -C vs checkout c1050c16d9b3881e5d4161ee58ccc0582b3f20f9

      - name: Instalar só o necessário para o motor OmniVoice (CPU)
        run: |
          python -m pip install --upgrade pip
          pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install "transformers>=5.10.0" accelerate pydub soundfile numpy "huggingface_hub>=1.7" "hf-xet>=1.1"

      - name: Gerar as falas
        env:
          PYTHONPATH: ${{ github.workspace }}/vs
          TEXTO: "Olá! Este é um teste de voz feito com o VoiceStudio, uma ferramenta de código aberto que roda direto no computador. E aí, o que achou?"
        run: |
          mkdir -p saidas_voicestudio
          time python -m omnivoice.cli.infer --text "$TEXTO" --language pt \
            --instruct "male, young adult, moderate pitch" \
            --output saidas_voicestudio/voz_masculina.wav
          time python -m omnivoice.cli.infer --text "$TEXTO" --language pt \
            --instruct "female, young adult, moderate pitch" \
            --output saidas_voicestudio/voz_feminina.wav
          ls -la saidas_voicestudio

      - name: Devolver os áudios para a branch
        run: |
          git config user.name "estudio-vozes"
          git config user.email "actions@users.noreply.github.com"
          git add saidas_voicestudio
          git commit -m "Teste VoiceStudio: falas geradas"
          git push
