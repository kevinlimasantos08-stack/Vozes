name: Humano 3D

on:
  push:
    paths:
      - "blender/humano/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: humano3d
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      OUT: saidas3d/humano
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Blender e MPFB
        run: |
          mkdir -p $OUT
          echo "inicio $(date -u +%H:%M:%S) nucleos=$(nproc)" > $OUT/andamento.txt
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq libegl1 libgl1 libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 zip >/dev/null
          curl -sSfL -o b.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar -xf b.tar.xz && mv blender-4.2.3-linux-x64 blender-app && rm b.tar.xz
          git clone -q --depth 1 https://github.com/makehumancommunity/mpfb2.git /tmp/mpfb2
          (cd /tmp/mpfb2/src/mpfb && zip -qr /tmp/mpfb.zip .)
          ./blender-app/blender -b --command extension install-file -r user_default --enable /tmp/mpfb.zip 2>&1 | tail -5 | tee -a $OUT/andamento.txt

      - name: Preparar envio de andamento
        run: |
          git config --global user.name "estudio-vozes"
          git config --global user.email "actions@users.noreply.github.com"
          cat > /tmp/enviar.sh <<'SH'
          enviar () {
            for t in 1 2 3; do
              git fetch -q origin main && git reset -q origin/main
              git add $OUT
              git diff --cached --quiet && return 0
              git commit -qm "$1" && git push -q origin HEAD:main && return 0
              sleep 5
            done
            return 0
          }
          SH

      - name: Recuperar pacotes já baixados
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: /tmp/packs
          key: mhpacks-v2

      - name: Baixar pacotes de assets (CC0)
        if: steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 60
        run: |
          source /tmp/enviar.sh
          mkdir -p /tmp/packs
          git config user.name "estudio-vozes"
          git config user.email "actions@users.noreply.github.com"
          baixar () {
            ini=$(date +%s)
            for host in files2 files; do
              if curl -sSfL --retry 2 -C - --connect-timeout 30 --speed-limit 20000 --speed-time 90 --max-time 1500 \
                   -o /tmp/packs/$1.zip "https://$host.makehumancommunity.org/asset_packs/$2"; then
                echo "ok $1 $host $(du -h /tmp/packs/$1.zip | cut -f1) em $(( $(date +%s) - ini ))s" >> $OUT/andamento.txt
                break
              else
                echo "falhou $1 $host apos $(( $(date +%s) - ini ))s" >> $OUT/andamento.txt
                rm -f /tmp/packs/$1.zip
              fi
            done
            enviar "Humano 3D: pacote $1"
          }
          # o servidor do MakeHuman é muito lento a partir do GitHub (~10 KB/s): só o pacote pequeno de barbas
          baixar bodyparts05 bodyparts05/bodyparts05_cc0.zip

      - name: Guardar pacotes para as próximas vezes
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: /tmp/packs
          key: mhpacks-v2

      - name: Assets base do MakeHuman (CC0)
        continue-on-error: true
        timeout-minutes: 30
        run: |
          source /tmp/enviar.sh
          mkdir -p /tmp/mh && cd /tmp/mh
          achar_base () { find /tmp/mh -type d -name skins -printf '%h\n' 2>/dev/null | while read d; do [ -d "$d/clothes" ] && echo "$d" && break; done; }
          # 1) pacote Ubuntu do PPA oficial (rápido, CDN do Launchpad)
          ini=$(date +%s)
          for dist in focal jammy bionic; do
            idx="https://ppa.launchpadcontent.net/makehuman-official/makehuman-community/ubuntu/dists/$dist/main/binary-amd64/Packages.gz"
            if curl -sSfL --max-time 60 "$idx" -o Packages.gz; then
              zcat Packages.gz | grep "^Filename:" | awk '{print $2}' > lista.txt
              echo "PPA $dist: $(tr '\n' ' ' < lista.txt)" >> $GITHUB_WORKSPACE/$OUT/andamento.txt
              for f in $(grep -E "makehuman-community(-bodyparts|-clothes|-hair|-skins|-proxymeshes)?(-dev)?_" lista.txt); do
                curl -sSfL --max-time 900 -o pkg.deb "https://ppa.launchpadcontent.net/makehuman-official/makehuman-community/ubuntu/$f" && dpkg-deb -x pkg.deb /tmp/mh/ppa && echo "  $(basename $f) $(du -h pkg.deb | cut -f1)" >> $GITHUB_WORKSPACE/$OUT/andamento.txt && rm pkg.deb
              done
              [ -n "$(achar_base)" ] && break
            fi
          done
          echo "PPA $(( $(date +%s) - ini ))s base=$(achar_base)" >> $GITHUB_WORKSPACE/$OUT/andamento.txt
          # 2) se não deu, repositório de assets com Git LFS
          if [ -z "$(achar_base)" ]; then
            ini=$(date +%s)
            git lfs install >/dev/null
            git clone -q --depth 1 https://github.com/makehumancommunity/makehuman-assets.git /tmp/mh/lfs \
              || echo "clone LFS falhou" >> $GITHUB_WORKSPACE/$OUT/andamento.txt
            echo "LFS $(( $(date +%s) - ini ))s base=$(achar_base)" >> $GITHUB_WORKSPACE/$OUT/andamento.txt
          fi
          b=$(achar_base)
          if [ -n "$b" ]; then
            ln -sfn "$b" /tmp/mhbase
            echo "pastas: $(ls $b | tr '\n' ' ')" >> $GITHUB_WORKSPACE/$OUT/andamento.txt
            echo "pngs: $(find $b -name '*.png' | wc -l), exemplo $(find $b -name '*.png' -size +20k | head -1)" >> $GITHUB_WORKSPACE/$OUT/andamento.txt
            echo "mhclo: $(find $b -name '*.mhclo' | wc -l) mhpxy: $(find $b -name '*.mhpxy' | wc -l) obj: $(find $b -name '*.obj' | wc -l)" >> $GITHUB_WORKSPACE/$OUT/andamento.txt
            for d in eyes eyebrows eyelashes hair teeth tongue; do echo "$d: $(find $b/$d -name '*.mhclo' -printf '%f ' 2>/dev/null | head -c 300)" >> $GITHUB_WORKSPACE/$OUT/andamento.txt; done
            echo "roupas: $(find $b/clothes -name '*.mhclo' -printf '%f ' | head -c 900)" >> $GITHUB_WORKSPACE/$OUT/andamento.txt
            echo "peles: $(find $b/skins -name '*.mhmat' -printf '%f ' )" >> $GITHUB_WORKSPACE/$OUT/andamento.txt
          fi
          cd $GITHUB_WORKSPACE
          enviar "Humano 3D: assets base"

      - name: Montar e renderizar o Dr. Rafael
        continue-on-error: true
        timeout-minutes: 80
        run: |
          ./blender-app/blender -b --addons bl_ext.user_default.mpfb -P blender/humano/fase1.py -- $OUT /tmp/packs /tmp/mhbase > $OUT/log.txt 2>&1
          echo "render fim $(date -u +%H:%M:%S)" >> $OUT/andamento.txt

      - name: Devolver para o repositório
        if: always()
        run: |
          source /tmp/enviar.sh
          [ -f $OUT/log.txt ] && grep -v "^Fra:\|Sample \|Rendering\|Updating" $OUT/log.txt | tail -c 15000 > $OUT/log_curto.txt && rm $OUT/log.txt
          git config user.name "estudio-vozes"
          git config user.email "actions@users.noreply.github.com"
          echo "fim $(date -u +%H:%M:%S)" >> $OUT/andamento.txt
          enviar "Humano 3D: resultado"
