name: Gerar vozes

on:
  push:
    paths:
      - "pedidos/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vozes
  cancel-in-progress: false

jobs:
  vozes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar o que os pedidos pedem
        run: |
          python -m pip install --upgrade pip
          # só considera pedidos ainda sem resultado (sem saidas/<id>/status.json)
          PEND=$(python - <<'PY'
          import json, glob, os
          for f in glob.glob("pedidos/*.json"):
              try: d = json.load(open(f, encoding="utf-8"))
              except Exception: continue
              if not os.path.exists(f"saidas/{d.get('id')}/status.json"): print(d.get("motor", ""))
          PY
          )
          echo "Motores pendentes: $PEND"
          if echo "$PEND" | grep -qE "gemini|refs"; then pip install "google-genai>=2.25.0"; fi
          if echo "$PEND" | grep -q "chatterbox"; then pip install --no-cache-dir chatterbox-tts; fi
          if echo "$PEND" | grep -q "transcrever"; then pip install --no-cache-dir faster-whisper; fi

      - name: Gerar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/gerar.py

      - name: Devolver os áudios para o repositório
        run: |
          git config user.name "estudio-vozes"
          git config user.email "actions@users.noreply.github.com"
          git add saidas refs 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Vozes geradas"
          git pull --rebase
          git push
