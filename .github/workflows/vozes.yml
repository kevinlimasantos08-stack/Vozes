name: Gerar vozes

on:
  push:
    paths:
      - "pedidos/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: vozes
  cancel-in-progress: false

jobs:
  vozes:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar o que os pedidos pedem
        run: |
          python -m pip install --upgrade pip
          if grep -lq '"motor": *"\(gemini\|refs\)"' pedidos/*.json 2>/dev/null; then pip install "google-genai>=2.25.0"; fi
          if grep -lq '"motor": *"chatterbox"' pedidos/*.json 2>/dev/null; then pip install chatterbox-tts; fi

      - name: Gerar
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/gerar.py

      - name: Devolver os áudios para o repositório
        run: |
          git config user.name "estudio-vozes"
          git config user.email "actions@users.noreply.github.com"
          git add saidas refs 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Vozes geradas"
          git pull --rebase
          git push
