name: Toon 3D

on:
  push:
    paths:
      - "blender/toon/**"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: toon3d
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        parte: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Instalar Blender
        run: |
          sudo apt-get update -qq >/dev/null
          sudo apt-get install -y -qq xvfb libegl1 libgl1 libgl1-mesa-dri libxi6 libxxf86vm1 libxfixes3 libxrender1 libxkbcommon0 libsm6 >/dev/null
          curl -sSfL -o b.tar.xz https://download.blender.org/release/Blender4.2/blender-4.2.3-linux-x64.tar.xz
          tar -xf b.tar.xz && mv blender-4.2.3-linux-x64 /tmp/blender && rm b.tar.xz

      - name: Renderizar parte ${{ matrix.parte }}
        run: |
          P=${{ matrix.parte }}
          INI=$(( (P - 1) * 72 + 1 )); FIM=$(( P * 72 ))
          ini=$(date +%s)
          xvfb-run -a -s "-screen 0 1920x1080x24" /tmp/blender -b -P blender/toon/teste_toon.py -- /tmp/quadros $INI $FIM 2>&1 | grep -v "^Fra:" | tail -20
          echo "parte $P: quadros $INI-$FIM em $(( $(date +%s) - ini ))s, $(ls /tmp/quadros | wc -l) arquivos" | tee /tmp/quadros/tempo_$P.txt

      - uses: actions/upload-artifact@v4
        with:
          name: quadros-${{ matrix.parte }}
          path: /tmp/quadros
          retention-days: 2

  juntar:
    needs: render
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/partes
      - name: Montar o vídeo e devolver
        run: |
          sudo apt-get update -qq >/dev/null && sudo apt-get install -y -qq ffmpeg >/dev/null
          mkdir -p /tmp/q saidas3d/toon
          cp /tmp/partes/*/f_*.png /tmp/q/
          cat /tmp/partes/*/tempo_*.txt > saidas3d/toon/tempos.txt
          ls /tmp/q | wc -l >> saidas3d/toon/tempos.txt
          ffmpeg -v error -y -framerate 24 -start_number 1 -i /tmp/q/f_%04d.png -c:v libx264 -preset veryfast -crf 19 -pix_fmt yuv420p saidas3d/toon/teste_toon.mp4
          for f in 0060 0140 0200 0260; do cp /tmp/q/f_$f.png saidas3d/toon/ 2>/dev/null || true; done
          git config user.name "estudio-vozes"
          git config user.email "actions@users.noreply.github.com"
          git add saidas3d/toon
          git commit -qm "Toon 3D: vídeo de teste"
          git pull -q --rebase && git push -q
